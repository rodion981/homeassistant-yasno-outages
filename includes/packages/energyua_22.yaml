############################################
# includes/packages/energyua_22.yaml
# Alerts Energy: Київ, ДТЕК, черга 2.2
############################################

# Значення годин у API:
# 0 — світло є; 1 — немає всю годину;
# 2 — немає перші 30 хв; 3 — немає другі 30 хв.
rest:
  - resource: "https://alerts.energy/api/v1/source-registry/areas/kyiv/shutdowns"
    scan_interval: 60
    timeout: 30
    headers:
      Referer: https://alerts.energy/kyiv
      User-Agent: Mozilla/5.0 (Home Assistant; alerts.energy schedule)
      Accept: application/json
    sensor:
      - name: energyua_22_today_hours
        unique_id: energyua_22_today_hours
        value_template: >-
          {% set rows = value_json
            | selectattr('initiator', 'eq', 'kyiv_oblenergo')
            | selectattr('queue', 'eq', '2.2') | list %}
          {{ (rows[0].today if rows else []) | to_json }}
      - name: energyua_22_tomorrow_hours
        unique_id: energyua_22_tomorrow_hours
        value_template: >-
          {% set rows = value_json
            | selectattr('initiator', 'eq', 'kyiv_oblenergo')
            | selectattr('queue', 'eq', '2.2') | list %}
          {{ (rows[0].tomorrow if rows else []) | to_json }}


# 2) TEMPLATE-СЕНСОРИ
sensor:
  - platform: template
    sensors:
      # Перетворення 24 погодинних кодів alerts.energy на перші два
      # суцільні періоди відключення з точністю до 30 хвилин.
      energyua_22_today_slot1_start_text:
        friendly_name: "Сьогодні: початок 1-го періоду (текст)"
        value_template: >-
          {% set hours = states('sensor.energyua_22_today_hours') | from_json([]) %}
          {% set ns = namespace(bits=[], periods=[], start=none) %}
          {% for v in hours %}{% set ns.bits = ns.bits + [v in [1,2], v in [1,3]] %}{% endfor %}
          {% for on in ns.bits %}
            {% if on and ns.start is none %}{% set ns.start = loop.index0 %}
            {% elif not on and ns.start is not none %}{% set ns.periods = ns.periods + [[ns.start, loop.index0]] %}{% set ns.start = none %}{% endif %}
          {% endfor %}
          {% if ns.start is not none %}{% set ns.periods = ns.periods + [[ns.start, 48]] %}{% endif %}
          {% if ns.periods | length > 0 %}{{ '%02d:%02d' | format(ns.periods[0][0] // 2, (ns.periods[0][0] % 2) * 30) }}{% endif %}

      energyua_22_today_slot1_end_text:
        friendly_name: "Сьогодні: кінець 1-го періоду (текст)"
        value_template: >-
          {% set hours = states('sensor.energyua_22_today_hours') | from_json([]) %}
